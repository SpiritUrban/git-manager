name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  validate-version:
    name: Validate Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate versions match git tag
        run: pnpm version:check

  build-tauri:
    needs: validate-version
    name: Build Desktop App (${{ matrix.label }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # The Intel macOS build cross-compiles from the arm64 runner: the
        # macos-13 label no longer gets assigned a runner and left the job
        # queued indefinitely, which kept the whole run from ever completing.
        include:
          - platform: 'windows-latest'
            label: 'windows-x64'
            args: ''
            rust_targets: ''
          - platform: 'ubuntu-22.04'
            label: 'linux-x64'
            args: ''
            rust_targets: ''
          - platform: 'macos-latest'
            label: 'macos-arm64'
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            label: 'macos-x64'
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Two matrix entries share the macos-latest runner, so the label has
          # to be part of the key or they would fight over one cache.
          key: ${{ matrix.label }}

      - name: Install Linux GUI Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action reports only the exit code of the build command, so run the
      # same command first with the output captured and surfaced as annotations.
      # A warm target dir makes the build inside tauri-action incremental.
      - name: Build Desktop App
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @git-manager/desktop tauri build ${{ matrix.args }} 2>&1 | tee build.log

      - name: Surface build output
        if: failure()
        shell: bash
        run: |
          if [ ! -s build.log ]; then
            echo "::error title=Build::build.log is missing or empty"
            exit 0
          fi
          log=$(tail -c 6000 build.log)
          log="${log//'%'/'%25'}"
          log="${log//$'\r'/'%0D'}"
          log="${log//$'\n'/'%0A'}"
          echo "::error title=Build output::$log"

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './apps/desktop'
          # pnpm workspace: the lockfile lives in the repo root, so tauri-action
          # would otherwise fall back to npm for the build command. The script
          # runs from the repo root, where there is no `tauri` script, hence the
          # explicit filter rather than a bare `pnpm tauri`.
          tauriScript: 'pnpm --filter @git-manager/desktop tauri'
          # Only publish a GitHub release for tag pushes; workflow_dispatch runs
          # are build-only smoke tests.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Git Manager {0}', github.ref_name) || '' }}
          releaseBody: 'See release notes for Git Manager ${{ github.ref_name }}.'
          releaseDraft: false
          prerelease: false
          # latest.json is what the in-app updater polls; without it the updater
          # endpoint 404s and no client ever sees an update.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The release is created by GITHUB_TOKEN, and GitHub deliberately does not
  # start workflows from events raised by that token — so the `release:
  # published` trigger in pages.yml never fires. Deploying from here instead
  # keeps the site's download links in step with the assets just uploaded.
  deploy-site:
    name: Deploy Site with Release Downloads
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
