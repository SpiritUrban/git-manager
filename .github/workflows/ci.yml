name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend CI (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm version:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Vitest Unit Tests
        run: pnpm test:ts

      - name: Build Desktop Frontend
        run: pnpm build:desktop

      - name: Build Marketing Site
        run: pnpm build:site

  rust:
    name: Rust Backend CI (Fmt, Clippy, Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # tauri::generate_context! embeds the frontend bundle at compile time, and
      # apps/desktop/dist is gitignored — without this the Rust checks cannot
      # compile at all.
      - name: Build Desktop Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:desktop

      - name: Check Rust Formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy Lints
        run: |
          set -o pipefail
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --message-format=short -- -D warnings 2>&1 | tee clippy.log

      # Clippy output otherwise lives only in the run log, which needs a
      # signed-in session to read. Annotations are public on a public repo.
      - name: Surface Clippy diagnostics
        if: failure()
        run: |
          if [ ! -s clippy.log ]; then
            echo "::error title=Clippy::clippy.log is missing or empty"
            exit 0
          fi
          log=$(tail -c 6000 clippy.log)
          log="${log//'%'/'%25'}"
          log="${log//$'\r'/'%0D'}"
          log="${log//$'\n'/'%0A'}"
          echo "::error title=Clippy output::$log"

      - name: Run Rust Unit Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
