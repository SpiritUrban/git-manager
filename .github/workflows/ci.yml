name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend CI (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm version:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Vitest Unit Tests
        run: pnpm test:ts

      - name: Build Desktop Frontend
        run: pnpm build:desktop

      - name: Build Marketing Site
        run: pnpm build:site

  rust:
    name: Rust Backend CI (Fmt, Clippy, Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Rust Formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy Lints
        run: |
          set -o pipefail
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --message-format=short -- -D warnings 2>&1 | tee clippy.log

      # Clippy output otherwise lives only in the run log, which is not readable
      # without a signed-in session. Annotations and the job summary are.
      - name: Surface Clippy diagnostics
        if: failure()
        run: |
          grep -E ':[0-9]+:[0-9]+: (error|warning)' clippy.log | head -40 |
            while IFS= read -r line; do echo "::error::$line"; done
          {
            echo '### Clippy output'
            echo '```'
            head -200 clippy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Rust Unit Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
