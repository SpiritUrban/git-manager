      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#tile)" />

